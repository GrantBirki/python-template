name: acceptance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_FIND_LINKS: ${{ github.workspace }}/vendor/cache/python/linux-x86_64
  PIP_NO_INDEX: "1"

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: openai/fence@c22db5d5c19f83d1d7b40e9def37a7a6099bbca2 # pin@v0.8.10
        with:
          mode: block
          container_policy: unsafe_preserve
          allowlist: |
            registry-1.docker.io
            auth.docker.io
            production.cloudfront.docker.com
            cidr 172.17.0.0/16 tcp 8000

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: setup python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # pin@v6.3.0
        with:
          python-version-file: .python-version
          check-latest: false

      - name: acceptance
        run: script/acceptance
